services:
  server:
    build: ./server
    container_name: lab1-chat-server
    environment:
      - TZ=Europe/Kyiv
    ports:
      - "3000:3000"
    restart: unless-stopped

  client:
    build: ./client
    container_name: lab1-chat-client
    environment:
      - TZ=Europe/Kyiv
    ports:
      - "4200:4200"
    depends_on:
      - server
    restart: unless-stopped
